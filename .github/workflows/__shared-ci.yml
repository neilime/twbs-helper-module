name: Shared - Continuous Integration for common tasks
on:
  workflow_call:
    inputs:
      publish:
        default: false
        type: boolean
    outputs:
      website-artifact-id:
        description: The uploaded website build artifact ID
        value: ${{ jobs.build-website.outputs.artifact-id }}
      website-artifact-path:
        description: The uploaded website build artifact path
        value: ${{ jobs.build-website.outputs.artifact-path }}
permissions: {}
jobs:
  checks:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/continuous-integration.yml@b81aa7b46f6b7a18ff1d9582c918cc1cc8296b98 # 2.0.0
    permissions:
      contents: read
      id-token: write
    with:
      ignore-plugins: false
      test: '{"coverage":"codecov"}'
      package: |
        {
          "tests": "php <<'PHP'\n<?php\nrequire 'vendor/autoload.php';\n$config = (new TwbsHelper\\ConfigProvider())();\nif (empty($config['view_helpers']) || empty($config['view_manager']['template_map'])) {\n    throw new RuntimeException('The installed module must include its configuration and templates.');\n}\nforeach ($config['view_manager']['template_map'] as $directory) {\n    if (!is_file($directory)) {\n        throw new RuntimeException('Missing packaged template file.');\n    }\n}\nPHP"
        }
  build-website:
    name: Check that website is building without errors
    uses: $/.github/workflows/__build-website.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      publish: ${{ inputs.publish }}
