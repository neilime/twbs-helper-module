name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
    branches: [main]

permissions: {}

jobs:
  greetings:
    if: ${{ github.event_name == 'issues' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    uses: hoverkraft-tech/ci-github-common/.github/workflows/greetings.yml@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
    permissions:
      contents: read
      issues: write
      pull-requests: write
