name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
    branches: [main]

permissions: {}

jobs:
  greetings:
    if: ${{ github.event_name == 'issues' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    uses: hoverkraft-tech/ci-github-common/.github/workflows/greetings.yml@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
    permissions:
      contents: read
      issues: write
      pull-requests: write
