---
name: "Prepare release"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/prepare-release.yml@218a19141dd9c88bd74b0ad28f1facb4c3568fbb # 1.0.0
    permissions:
      contents: read
      id-token: write
      pull-requests: write
